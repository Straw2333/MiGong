const ICON_FULL_EXIT = '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h6V3M21 9h-6V3M3 15h6v6M21 15h-6v6"/></svg>';

function isStandaloneMode() {
  return window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}

function getFullscreenEl() {
  return document.fullscreenElement || document.webkitFullscreenElement || null;
}

function updateToolBtns() {
  const soundOn = Sound.isOn();
  for (const id of ['btnSound', 'btnHomeSound']) {
    const el = $(id);
    el.innerHTML = soundOn ? ICON_SOUND_ON : ICON_SOUND_OFF;
    el.setAttribute('aria-label', soundOn ? '关闭声音' : '打开声音');
  }
  for (const id of ['btnRotate', 'btnHomeRotate']) {
    const el = $(id);
    el.innerHTML = ICON_ROTATE;
    el.classList.toggle('active', state.rotated);
    el.setAttribute('aria-label', state.rotated ? '恢复竖屏' : '旋转横屏');
  }
  const isFull = !!getFullscreenEl() || isStandaloneMode();
  for (const id of ['btnFull', 'btnHomeFull']) {
    const el = $(id);
    el.innerHTML = isFull ? ICON_FULL_EXIT : ICON_FULL_ENTER;
    el.classList.toggle('active', isFull);
  }
}

function rebuildHud() {
  $('levelPill').textContent = '第 ' + state.level + ' 关';
  const wrap = $('starIcons');
  wrap.innerHTML = '';
  for (const s of state.stars) {
    const el = document.createElement('span');
    el.className = 'star-icon' + (s.collected ? ' on' : '');
    el.textContent = '★';
    wrap.appendChild(el);
  }
}

function starIconsHTML(filled, total) {
  let html = '';
  for (let i = 0; i < total; i++) {
    html += '<span class="star-icon' + (i < filled ? ' on' : '') + '">★</span>';
  }
  return html;
}

function homeCardCount(cur) {
  const bestKeys = Object.keys(save.best).map(Number).filter(Number.isFinite);
  const highest = Math.max(cur, bestKeys.length ? Math.max(...bestKeys) : 1);
  const baseCards = highest >= DEFAULT_LEVEL_CARDS
    ? Math.ceil((highest + 2) / 4) * 4
    : DEFAULT_LEVEL_CARDS;
  return Math.min(999, baseCards + extraLevelCards);
}

let stickerHintTimer = null;

function openStickerModal(st) {
  $('modalStickerIcon').textContent = st.emoji;
  $('modalStickerName').textContent = st.name + '贴纸';
  $('modalStickerDesc').textContent = '集齐 ' + st.need + ' 颗星星收获的宝贝！';
  $('stickerModal').classList.remove('hidden');
  Sound.sticker();
}

function renderHome() {
  const total = albumStars();
  $('totalStars').textContent = total;
  const cur = clamp(save.current || 1, 1, 9999);
  $('startHint').textContent = cur > 1 ? '继续第 ' + cur + ' 关' : '从第 1 关开始';

  const cardCount = homeCardCount(cur);
  $('levelScrollHint').textContent = cardCount > DEFAULT_LEVEL_CARDS ? '· 可上下滑动' : '';

  const grid = $('levelGrid');
  grid.innerHTML = '';
  let nextCardEl = null;
  for (let i = 1; i <= cardCount; i++) {
    const cleared = save.best[i] !== undefined;
    const stars = save.best[i] || 0;
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'level-card' + (cleared ? ' cleared' : '') + (i === cur ? ' next' : '');
    card.setAttribute('aria-label', '第 ' + i + ' 关');
    card.innerHTML =
      '<span class="level-num">' + i + '</span>' +
      '<span class="level-stars">' + starIconsHTML(stars, levelStarCount(i)) + '</span>' +
      (cleared ? '<span class="level-check">✓</span>' : '');
    card.addEventListener('click', () => {
      Sound.ensure();
      Sound.click();
      Sound.startMusic();
      startLevel(i);
    });
    if (i === cur) nextCardEl = card;
    grid.appendChild(card);
  }

  $('btnMoreLevels').textContent = '+ 再显示 8 关（当前共 ' + cardCount + ' 关）';
  if (nextCardEl && cur > DEFAULT_LEVEL_CARDS) {
    requestAnimationFrame(() => nextCardEl.scrollIntoView({ block: 'nearest' }));
  }

  const unlockedCount = STICKERS.filter(s => total >= s.need).length;
  const row = $('stickerRow');
  row.innerHTML = '';
  for (const st of STICKERS) {
    const unlocked = total >= st.need;
    const just = state.justUnlocked.includes(st.need);
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'sticker-badge ' + (unlocked ? 'unlocked' : 'locked') + (just ? ' just-unlocked' : '');
    el.setAttribute('aria-label', unlocked ? st.name + '贴纸' : '集齐 ' + st.need + ' 颗星解锁');
    el.innerHTML =
      (!unlocked ? '<span class="sticker-lock">🔒</span>' : '') +
      '<span class="sticker-cutout"><span class="sticker-emoji">' + st.emoji + '</span></span>' +
      (unlocked
        ? '<span class="sticker-name">' + st.name + '</span>'
        : '<span class="sticker-need">' + st.need + '★</span>');
    el.addEventListener('click', () => {
      Sound.ensure();
      if (unlocked) {
        state.justUnlocked = state.justUnlocked.filter(n => n !== st.need);
        el.classList.remove('just-unlocked');
        openStickerModal(st);
      } else {
        Sound.bump();
        el.classList.remove('shake');
        void el.offsetWidth;
        el.classList.add('shake');
        const needMore = st.need - total;
        const hint = $('stickerHint');
        hint.textContent = '还差 ' + needMore + ' 颗★解锁哦';
        clearTimeout(stickerHintTimer);
        stickerHintTimer = setTimeout(() => {
          const all = albumStars() >= MAX_STARS;
          hint.textContent = all ? '8/8 全部集齐啦！' : '已集 ' + unlockedCount + '/' + STICKERS.length + ' 张';
        }, 2000);
      }
    });
    row.appendChild(el);
  }

  const all = total >= MAX_STARS;
  const hint = $('stickerHint');
  hint.textContent = all ? '8/8 全部集齐啦！' : '已集 ' + unlockedCount + '/' + STICKERS.length + ' 张';
  hint.classList.toggle('all', all);
}

function goHome() {
  Sound.click();
  state.phase = 'home';
  resetPointer();
  state.tapTarget = null;
  state.tapPath = null;
  state.tapRipple = null;
  state.keys.clear();
  state.particles = [];
  state.hint = { path: null, until: 0 };
  clearTimeout(state.winTimer);
  state.winTimer = null;
  mazeCache = null;
  state.cols = 0;
  state.rows = 0;
  state.grid = [];
  state.stars = [];
  state.collected = 0;
  $('hud').classList.add('hidden');
  $('win').classList.add('hidden');
  $('newStickers').classList.add('hidden');
  $('stickerModal').classList.add('hidden');
  $('fsModal').classList.add('hidden');
  $('home').classList.remove('hidden');
  renderHome();
}

function showWinOverlay() {
  const wrap = $('winStars');
  wrap.innerHTML = '';
  for (const s of state.stars) {
    const el = document.createElement('span');
    el.className = 'star-icon' + (s.collected ? ' on' : '');
    el.textContent = '★';
    wrap.appendChild(el);
  }

  const total = albumStars();
  if (total >= MAX_STARS) {
    $('winMsg').textContent = '哇！贴纸全部集齐啦！';
  } else if (state.collected === state.stars.length) {
    $('winMsg').textContent = '哇！星星全找到啦！';
  } else {
    $('winMsg').textContent = '找到大萝卜啦！';
  }

  // 攒星解锁下一张贴纸进度条
  const nextSt = STICKERS.find(s => total < s.need);
  const prevTotal = clamp(state.prevAlbumStars || 0, 0, MAX_STARS);
  const fill = $('winProgFill');
  if (nextSt) {
    const prevIdx = STICKERS.indexOf(nextSt) - 1;
    const baseNeed = prevIdx >= 0 ? STICKERS[prevIdx].need : 0;
    const span = nextSt.need - baseNeed;
    const fromPct = clamp(((prevTotal - baseNeed) / span) * 100, 0, 100);
    const toPct = clamp(((total - baseNeed) / span) * 100, 0, 100);
    const left = nextSt.need - total;
    $('winProgText').textContent = '还差 ' + left + ' 颗★解锁「' + nextSt.name + '」';
    $('winProgTarget').textContent = total + '/' + nextSt.need + '★ ' + nextSt.emoji;
    fill.style.transition = 'none';
    fill.style.width = fromPct.toFixed(1) + '%';
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        fill.style.transition = '';
        fill.style.width = toPct.toFixed(1) + '%';
      });
    });
  } else {
    $('winProgText').textContent = '贴纸册全部集满啦！';
    $('winProgTarget').textContent = MAX_STARS + '/' + MAX_STARS + '★ 👑';
    fill.style.transition = 'none';
    fill.style.width = '100%';
  }

  const box = $('newStickers');
  const list = $('newStickerList');
  if (state.newStickers.length) {
    box.classList.remove('hidden');
    list.innerHTML = state.newStickers
      .map(s =>
        '<div class="new-sticker-card">' +
          '<div class="new-sticker-orb">' + s.emoji + '</div>' +
          '<span class="new-sticker-name">' + s.name + '</span>' +
        '</div>'
      )
      .join('');
    Sound.sticker();
  } else {
    box.classList.add('hidden');
    list.innerHTML = '';
  }

  $('win').classList.remove('hidden');
}

function toggleSound() {
  const on = Sound.toggle();
  updateToolBtns();
  if (on) {
    Sound.ensure();
    Sound.startMusic();
    Sound.click();
  }
}

function toggleRotate() {
  Sound.ensure();
  Sound.click();
  resetPointer();
  state.rotated = !state.rotated;
  updateToolBtns();
  computeLayout();
  scheduleLayoutSync();
}

async function toggleFullscreen() {
  Sound.ensure();
  Sound.click();
  resetPointer();
  const root = document.documentElement;
  const curFull = getFullscreenEl();
  try {
    if (curFull) {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      updateToolBtns();
      computeLayout();
      scheduleLayoutSync();
      return;
    }
    if (root.requestFullscreen) {
      await root.requestFullscreen();
      updateToolBtns();
      computeLayout();
      scheduleLayoutSync();
      return;
    }
    if (root.webkitRequestFullscreen) {
      root.webkitRequestFullscreen();
      updateToolBtns();
      computeLayout();
      scheduleLayoutSync();
      return;
    }
  } catch (err) { /* Safari 不允许网页原生全屏 */ }

  if (isStandaloneMode()) {
    $('fsTitle').textContent = '已经是全屏模式啦';
    $('fsDesc').innerHTML = '你现在正从桌面图标打开游玩，已经是 <b>真全屏模式</b> 啦！<br>也可以点右下按钮旋转成横屏体验更大的迷宫~';
  } else {
    $('fsTitle').textContent = '全屏游玩小贴士';
    $('fsDesc').innerHTML = '苹果 Safari 浏览器限制网页直接隐藏网址栏，只需 <b>2 步</b> 就能变成真正全屏：<br>1. 点 Safari 底部（或右上角）的 <b>分享按钮 ↑</b><br>2. 往下滑点击 <b>「添加到主屏幕」</b><br>之后从桌面图标打开就是无地址栏真全屏啦！';
  }
  $('fsModal').classList.remove('hidden');
}

$('btnStart').addEventListener('click', () => {
  Sound.ensure();
  Sound.click();
  Sound.startMusic();
  startLevel(clamp(save.current || 1, 1, 9999));
});

$('btnNext').addEventListener('click', () => {
  Sound.click();
  startLevel(state.level + 1);
});

$('btnWinHome').addEventListener('click', goHome);
$('btnHome').addEventListener('click', goHome);

$('btnMoreLevels').addEventListener('click', () => {
  Sound.ensure();
  Sound.click();
  extraLevelCards += 8;
  renderHome();
  const scrollEl = $('levelScroll');
  requestAnimationFrame(() => {
    scrollEl.scrollTo({ top: scrollEl.scrollHeight, behavior: 'smooth' });
  });
});

$('btnSound').addEventListener('click', toggleSound);
$('btnHomeSound').addEventListener('click', toggleSound);
$('btnRotate').addEventListener('click', toggleRotate);
$('btnHomeRotate').addEventListener('click', toggleRotate);
$('btnFull').addEventListener('click', toggleFullscreen);
$('btnHomeFull').addEventListener('click', toggleFullscreen);

$('btnCloseSticker').addEventListener('click', () => {
  Sound.click();
  $('stickerModal').classList.add('hidden');
});
$('stickerModal').addEventListener('click', e => {
  if (e.target === $('stickerModal')) {
    Sound.click();
    $('stickerModal').classList.add('hidden');
  }
});

$('btnCloseFs').addEventListener('click', () => {
  Sound.click();
  $('fsModal').classList.add('hidden');
});
$('btnFsRotate').addEventListener('click', () => {
  $('fsModal').classList.add('hidden');
  toggleRotate();
});
$('fsModal').addEventListener('click', e => {
  if (e.target === $('fsModal')) {
    Sound.click();
    $('fsModal').classList.add('hidden');
  }
});

function onViewportChange() {
  updateToolBtns();
  computeLayout();
  scheduleLayoutSync();
}
document.addEventListener('fullscreenchange', onViewportChange);
document.addEventListener('webkitfullscreenchange', onViewportChange);
window.addEventListener('orientationchange', onViewportChange);

/* =========================================================
   开场小插画
   ========================================================= */
function drawLogo() {
  const cv = $('logoScreen');
  const g = cv.getContext('2d');
  const W = 300, H = 180;
  g.setTransform(2, 0, 0, 2, 0, 0);
  g.clearRect(0, 0, W, H);

  const bg = g.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#d9f3ff');
  bg.addColorStop(0.55, '#cfecc0');
  bg.addColorStop(1, '#a8d991');
  roundRectPath(g, 0, 0, W, H, 26);
  g.fillStyle = bg;
  g.fill();

  g.save();
  roundRectPath(g, 0, 0, W, H, 26);
  g.clip();

  drawCloud(g, 70, 40, 16);
  drawCloud(g, 238, 34, 12);

  for (let i = 0; i < 7; i++) {
    drawBushTile(g, i * 46, 148, 46, 1000 + i * 97);
  }

  // 虚线小路
  g.strokeStyle = 'rgba(255,255,255,.85)';
  g.lineWidth = 6;
  g.lineCap = 'round';
  g.setLineDash([1, 12]);
  g.beginPath();
  g.moveTo(96, 132);
  g.quadraticCurveTo(152, 150, 212, 124);
  g.stroke();
  g.setLineDash([]);

  drawBunnyArt(g, 88, 102, 86, 0.6, { face: 1, moving: false });
  drawCarrotArt(g, 218, 102, 76, 0.9);

  g.fillStyle = '#ffd23f';
  g.strokeStyle = '#e09a00';
  g.lineWidth = 2;
  starPath(g, 158, 52, 15, 7);
  g.fill();
  g.stroke();
  starPath(g, 238, 66, 11, 5);
  g.fill();
  g.stroke();

  g.restore();

  roundRectPath(g, 0.5, 0.5, W - 1, H - 1, 26);
  g.strokeStyle = 'rgba(255,255,255,.75)';
  g.lineWidth = 3;
  g.stroke();
}

function initAppleTouchIcon() {
  try {
    const ic = document.createElement('canvas');
    ic.width = 180;
    ic.height = 180;
    const g = ic.getContext('2d');
    const bg = g.createLinearGradient(0, 0, 0, 180);
    bg.addColorStop(0, '#d9f3ff');
    bg.addColorStop(0.6, '#cfecc0');
    bg.addColorStop(1, '#9fd48d');
    g.fillStyle = bg;
    g.fillRect(0, 0, 180, 180);
    drawBunnyArt(g, 66, 102, 110, 0.6, { face: 1, moving: false });
    drawCarrotArt(g, 132, 102, 92, 0.9);
    const link = $('appleTouchIcon');
    if (link) link.href = ic.toDataURL('image/png');
  } catch (e) { /* 忽略 */ }
}

/* =========================================================
   启动
   ========================================================= */
function loop(now) {
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  update(dt);
  render(now / 1000);
  requestAnimationFrame(loop);
}

let lastT = performance.now();

computeLayout();
drawLogo();
initAppleTouchIcon();
updateToolBtns();
renderHome();

// 开发/测试用的小接口
window.__migong = {
  state,
  startLevel,
  win: doWin,
  toggleRotate,
  setBunny(c, r) {
    state.bunny.x = c + 0.5;
    state.bunny.y = r + 0.5;
    state.bunny.vx = 0;
    state.bunny.vy = 0;
  },
  bunnyCell() {
    return { c: Math.floor(state.bunny.x), r: Math.floor(state.bunny.y) };
  },
  findPath,
};

requestAnimationFrame(loop);
})();
